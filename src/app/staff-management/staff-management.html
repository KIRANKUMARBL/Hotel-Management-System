<div class="container">

  <h2 class="title">Staff Management</h2>

  <div class="layout">

    <div class="left">

      <div class="form-card">
        <h3>Add Staff</h3>

        <!-- NAME -->
        <input 
          name="name"
          placeholder="Full Name"
          [(ngModel)]="newStaff.name"
          #name="ngModel"
          required
          minlength="3"
        >
        <div *ngIf="name.invalid && name.touched" class="error">
          Name must be at least 3 characters
        </div>

        <!-- EMAIL -->
        <input 
          name="email"
          placeholder="Email"
          [(ngModel)]="newStaff.email"
          #email="ngModel"
          required
          email
        >
        <div *ngIf="email.invalid && email.touched" class="error">
          Enter a valid email
        </div>

        <!-- PASSWORD -->
        <input 
          type="password"
          name="password"
          placeholder="Password"
          [(ngModel)]="newStaff.password"
          #password="ngModel"
          required
          minlength="6"
        >
        <div *ngIf="password.invalid && password.touched" class="error">
          Password must be at least 6 characters
        </div>

        <!-- ROLE -->
        <select 
          name="role"
          [(ngModel)]="newStaff.role"
          #role="ngModel"
          required
        >
          <option value="">Select Role</option>
          <option value="OWNER">Owner</option>
          <option value="MANAGER">Manager</option>
          <option value="RECEPTIONIST">Receptionist</option>
        </select>

        <div *ngIf="role.invalid && role.touched" class="error">
          Please select a role
        </div>

        <!-- BUTTON -->
        <button 
          (click)="addStaff()"
          [disabled]="isSubmitting || name.invalid || email.invalid || password.invalid || role.invalid"
        >
          {{ isSubmitting ? 'Adding...' : 'Add Staff' }}
        </button>

      </div>

    </div>

    <div class="right">

      <p *ngIf="isLoading">Loading staff...</p>

      <div class="grid" *ngIf="!isLoading">

        <div class="card" *ngFor="let s of staff">
          <h3>{{ s.name || 'No Name' }}</h3>
          <p><strong>Email:</strong> {{ s.email }}</p>
          <p><strong>Role:</strong> {{ s.role || 'N/A' }}</p>
        </div>

      </div>

    </div>

  </div>

</div>
