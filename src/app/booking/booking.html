

<div class="booking-container">

  <div class="form-card">
    <h2>Guest Details</h2>

   <form (ngSubmit)="createBooking()" #bookingForm="ngForm">

  <!-- NAME -->
  <label>Full Name</label>
  <input
    name="name"
    [(ngModel)]="bookingRequest.guest.name"
    #name="ngModel"
    required
    minlength="3"
  />

  <div *ngIf="name.invalid && name.touched" class="error">
    Name must be at least 3 characters
  </div>

  <!-- EMAIL -->
  <label>Email</label>
  <input
    name="email"
    type="email"
    [(ngModel)]="bookingRequest.guest.email"
    #email="ngModel"
    required
    email
  />

  <div *ngIf="email.invalid && email.touched" class="error">
    Enter a valid email
  </div>

  <!-- PHONE -->
  <label>Phone</label>
  <input
    name="phone"
    [(ngModel)]="bookingRequest.guest.phone"
    #phone="ngModel"
    required
    pattern="[0-9]{10}"
  />

  <div *ngIf="phone.invalid && phone.touched" class="error">
    Enter valid 10-digit phone number
  </div>

  <!-- ADDRESS -->
  <label>Address</label>
  <input
    name="address"
    [(ngModel)]="bookingRequest.guest.address"
    #address="ngModel"
    required
    minlength="5"
  />

  <div *ngIf="address.invalid && address.touched" class="error">
    Address must be at least 5 characters
  </div>

  <!-- GENDER -->
  <label>Gender</label>

  <select
    name="gender"
    [(ngModel)]="bookingRequest.guest.gender"
    #gender="ngModel"
    required
  >
    <option value="">Select</option>
    <option value="MALE">Male</option>
    <option value="FEMALE">Female</option>
  </select>

  <div *ngIf="gender.invalid && gender.touched" class="error">
    Please select gender
  </div>

  <!-- BUTTON -->
  <button
    type="submit"
    class="confirm-btn"
    [disabled]="
      isLoading ||
      name.invalid ||
      email.invalid ||
      phone.invalid ||
      address.invalid ||
      gender.invalid
    "
  >
    {{ isLoading ? 'Processing...' : 'Confirm Booking' }}
  </button>

</form>
  </div>

  <div class="summary-card">
    <h3>Booking Summary</h3>

    <p><strong>Room ID:</strong> {{ roomId }}</p>
    <p><strong>Price:</strong> ₹{{ price }}</p>

  </div>

</div>
